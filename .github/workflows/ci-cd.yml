name: CI/CD（采集服务·镜像仓库版·手动）

# 备用流水线：构建镜像推到阿里云 ACR 再部署。
# 默认只能手动触发，不随 push 自动跑。
# 主流程见 deploy-source.yml（源码传到服务器构建）。
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "跳过测试"
        type: boolean
        default: false
      deploy:
        description: "构建成功后部署到服务器"
        type: boolean
        default: true

concurrency:
  group: ci-cd-signup
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 仓库地址不是机密，写在这里方便看日志
  ACR_REGISTRY: crpi-quxtxo1i28qk1e0c.cn-guangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: arceus
  ACR_REPO: activity-66-collection-backend
  IMAGE_NAME: crpi-quxtxo1i28qk1e0c.cn-guangzhou.personal.cr.aliyuncs.com/arceus/activity-66-collection-backend

jobs:
  # ---------------------------------------------------------------- 1. 测试
  test:
    name: 测试
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 代码风格
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: 单元测试
        run: pytest -q

  # ---------------------------------------------------------------- 2. 构建推送
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 生成镜像标签
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 不用 buildx：阿里云 ACR 个人版不认 BuildKit 的 OCI 证明清单
      - name: 构建镜像
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          echo "目标镜像：$IMAGE_NAME:$TAG"
          [ -n "$TAG" ] || { echo "::error::镜像标签为空"; exit 1; }
          docker build --platform linux/amd64 \
            -t "$IMAGE_NAME:$TAG" -t "$IMAGE_NAME:latest" .

      - name: 推送镜像
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! docker push "$IMAGE_NAME:$TAG"; then
            echo "::error::推送被拒绝（denied）—— 检查仓库 $ACR_NAMESPACE/$ACR_REPO 是否已在 ACR 创建"
            exit 1
          fi
          docker push "$IMAGE_NAME:latest"

      - name: 校验镜像确实在仓库里
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          docker manifest inspect "$IMAGE_NAME:$TAG" > /dev/null 2>&1 \
            && echo "镜像已推送：$IMAGE_NAME:$TAG" \
            || { echo "::error::镜像没有推上去"; exit 1; }

  # ---------------------------------------------------------------- 3. 部署
  deploy:
    name: 部署到阿里云
    runs-on: ubuntu-latest
    needs: build
    if: ${{ (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true') || inputs.deploy }}
    environment: acr
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: 服务器自检
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'REMOTE'
          set -uo pipefail
          fail=0
          say() { printf '  %s\n' "$1"; }
          echo "== 服务器环境检查 =="
          command -v docker >/dev/null 2>&1 && say "docker 已安装" || { say "缺 docker"; fail=1; }
          docker ps >/dev/null 2>&1 && say "docker 可用" || { say "当前用户不能操作 docker"; fail=1; }
          [ -f /verifly/activity/.env ] && say ".env 存在" || { say "缺 /verifly/activity/.env"; fail=1; }
          [ -d /verifly/activity/uploads ] && say "附件目录存在" \
            || { say "缺 /verifly/activity/uploads"; fail=1; }
          exit $fail
          REMOTE

      - name: 部署
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "IMAGE='${{ env.IMAGE_NAME }}' TAG='${{ needs.build.outputs.tag }}' bash -s" <<'REMOTE'
          set -euo pipefail
          FULL="$IMAGE:$TAG"
          PREV="$(cat /verifly/activity/.last-image 2>/dev/null || echo '')"
          echo "==> 新版本：$FULL"

          echo "==> 拉取镜像"
          docker pull "$FULL"

          start() {
            docker rm -f activity-collection-api >/dev/null 2>&1 || true
            docker run -d \
              --name activity-collection-api \
              --restart unless-stopped \
              --env-file /verifly/activity/.env \
              --network host \
              -e UPLOAD_DIR=/data/uploads \
              -v /verifly/activity/uploads:/data/uploads \
              "$1"
          }

          healthy() {
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1 && return 0
              sleep 2
            done
            return 1
          }

          echo "==> 启动新版本"
          if ! start "$FULL"; then
            echo "容器启动失败"
            [ -n "$PREV" ] && { start "$IMAGE:$PREV" && healthy && echo "已回滚到 $PREV"; }
            exit 1
          fi

          if healthy; then
            echo "$TAG" > /verifly/activity/.last-image
            echo "部署成功：$FULL"
            curl -s http://127.0.0.1:8000/healthz; echo
            exit 0
          fi

          echo "健康检查失败，容器日志："
          docker logs --tail 40 activity-collection-api || true
          if [ -n "$PREV" ]; then
            echo "==> 回滚到 $PREV"
            start "$IMAGE:$PREV"
            if healthy; then echo "已回滚到 $PREV"; else echo "回滚后仍不健康，需人工处理"; fi
          else
            echo "没有上一版可回滚，请人工处理"
          fi
          exit 1
          REMOTE

      - name: 部署结果
        if: always()
        run: |
          echo "镜像：${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}"
          echo "提交：${{ github.sha }}"
